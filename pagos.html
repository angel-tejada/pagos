<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pagos">
<meta name="theme-color" content="#0E1116">
<title>Pagos</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230E1116'/%3E%3Ctext x='90' y='122' font-family='Helvetica' font-size='100' font-weight='bold' fill='%232DD4A7' text-anchor='middle'%3E%24%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0E1116; --card:#181D25; --card2:#222933; --line:#2B3541;
    --txt:#FFFFFF; --dim:#8E9BAB;
    --paid:#2DD4A7; --paid-ink:#06231B;
    --lent:#FF5F5F; --lent-ink:#2A0A0A;
    --accent:#2DD4A7;
    --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{
    background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;
  }
  .screen{display:none;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
  .screen.on{display:flex}

  header{
    padding:calc(var(--safe-t) + 12px) 14px 12px;
    display:flex;align-items:center;gap:10px;flex-shrink:0;
  }
  .topsum{
    flex:1;min-width:0;display:flex;align-items:baseline;justify-content:flex-end;
    gap:8px;flex-wrap:wrap;
  }
  .topsum-lbl{font-size:28px;color:var(--dim);font-weight:800;letter-spacing:-1.1px}
  .topsum-amt{font-size:30px;font-weight:800;color:var(--paid);letter-spacing:-1.2px;line-height:1.1}
  h2{font-size:17px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ico{
    width:44px;height:44px;border-radius:13px;background:var(--card2);
    display:flex;align-items:center;justify-content:center;
    font-size:19px;flex-shrink:0;border:none;color:var(--txt);cursor:pointer;
  }
  .ico:active{background:var(--line)}
  .ico.danger{color:var(--lent)}

  .searchwrap{padding:0 14px 10px;display:none;flex-shrink:0}
  .searchwrap.on{display:block}
  .searchwrap input{margin:0;padding:11px 14px;font-size:15px}

  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:96px}

  /* ---- lista de personas ---- */
  .sect{
    padding:14px 16px 8px;font-size:11px;color:var(--dim);
    font-weight:800;text-transform:uppercase;letter-spacing:1.1px;
  }
  .card{
    margin:0 14px 8px;background:var(--card);border-radius:12px;
    display:flex;align-items:center;padding:0 4px 0 0;overflow:hidden;
  }
  .strip{width:4px;align-self:stretch;flex-shrink:0;background:var(--line)}
  .card.owes .strip{background:var(--paid)}
  .card.over .strip{background:var(--lent)}
  .card-tap{flex:1;min-width:0;cursor:pointer;padding:10px 8px 10px 13px}
  .card-tap:active{opacity:.55}
  .c-name{font-size:14px;font-weight:600;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .c-amt{font-size:24px;font-weight:800;color:var(--paid);letter-spacing:-.8px;line-height:1.15;margin-top:1px}
  .card.clear .c-amt{font-size:18px;color:var(--dim)}
  .card.over .c-amt{color:var(--lent)}
  .c-sub{font-size:11px;color:var(--dim);margin-top:2px}
  .badge{
    display:inline-block;font-size:11px;font-weight:700;color:var(--dim);
    background:var(--card2);padding:3px 9px;border-radius:20px;margin-top:4px;
  }
  .card.over .badge{color:var(--lent);background:rgba(255,95,95,.14)}
  .plus{
    width:46px;height:46px;border-radius:13px;background:var(--card2);
    border:none;color:var(--txt);font-size:24px;font-weight:300;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;
  }
  .plus:active{background:var(--line)}

  .empty{padding:50px 30px;text-align:center;color:var(--dim);font-size:14px;line-height:1.7}

  .footbar{
    flex-shrink:0;background:var(--card);border-top:1px solid var(--line);
    padding:12px 14px calc(var(--safe-b) + 8px);
  }

  .fab{
    position:absolute;right:14px;bottom:14px;
    width:54px;height:54px;border-radius:17px;background:var(--card2);
    border:1px solid var(--line);
    color:var(--txt);font-size:27px;font-weight:300;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 20px rgba(0,0,0,.6);cursor:pointer;z-index:5;
  }
  .fab:active{transform:scale(.94)}
  .fabhost{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}

  /* ---- detalle ---- */
  .hero{padding:22px 18px 26px;text-align:center}
  .hero-lbl{font-size:11px;color:var(--dim);font-weight:800;text-transform:uppercase;letter-spacing:1.1px}
  .hero-amt{font-size:42px;font-weight:800;color:var(--paid);margin-top:5px;letter-spacing:-1.8px;line-height:1.05}
  .hero-amt.zero{color:var(--dim)}
  .hero-amt.over{color:var(--lent)}
  .hero-sub{font-size:13px;color:var(--dim);margin-top:8px;line-height:1.5}
  .divider{height:8px;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

  .mv{display:flex;align-items:center;gap:11px;padding:11px 6px 11px 16px}
  .mv+.mv{border-top:1px solid var(--line)}
  .tag{
    width:34px;height:34px;border-radius:11px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;
  }
  .tag.up{background:rgba(255,95,95,.18);color:var(--lent)}
  .tag.down{background:rgba(45,212,167,.18);color:var(--paid)}
  .mv-mid{flex:1;min-width:0}
  .mv-kind{font-size:14px;font-weight:700}
  .mv-kind.up{color:var(--lent)}
  .mv-kind.down{color:var(--paid)}
  .mv-eff{font-size:11px;color:var(--dim);margin-top:1px}
  .mv-date{font-size:11px;color:var(--dim);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mv-amt{font-size:18px;font-weight:800;flex-shrink:0;letter-spacing:-.4px}
  .mv-amt.up{color:var(--lent)}
  .mv-amt.down{color:var(--paid)}
  .mv-del{
    width:40px;height:40px;border-radius:12px;background:transparent;border:none;
    color:var(--dim);font-size:19px;flex-shrink:0;cursor:pointer;
  }
  .mv-del:active{background:var(--card2)}

  /* ---- botones de acción ---- */
  .acts{display:flex;gap:10px}
  .act{
    flex:1;min-height:58px;border-radius:14px;border:none;cursor:pointer;
    font-family:inherit;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;padding:6px 5px;
  }
  .act:active{opacity:.75}
  .act b{font-size:15px;font-weight:800;letter-spacing:.2px}
  .act i{font-size:10px;font-weight:700;font-style:normal;opacity:.72;letter-spacing:.2px}
  .act-lent{background:var(--lent);color:var(--lent-ink)}
  .act-paid{background:var(--paid);color:var(--paid-ink)}

  /* ---- hojas ---- */
  .sheet{
    position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;
    display:none;align-items:flex-end;
  }
  .sheet.on{display:flex}
  .sheet-in{
    width:100%;background:var(--card);border-radius:20px 20px 0 0;
    padding:16px 14px calc(var(--safe-b) + 14px);max-height:96vh;overflow-y:auto;
  }
  .sheet-h{font-size:17px;font-weight:800;margin-bottom:14px}
  .sheet-top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .sheet-top .sheet-h{flex:1;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  label{display:block;font-size:11px;color:var(--dim);font-weight:800;margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px}
  input{
    width:100%;padding:13px 14px;background:var(--card2);border:1px solid var(--line);
    border-radius:12px;color:var(--txt);font-size:16px;font-family:inherit;
    margin-bottom:16px;-webkit-appearance:none;
  }
  input:focus{outline:none;border-color:var(--accent)}
  .btns{display:flex;gap:10px;margin-top:6px}
  .btn{
    flex:1;min-height:50px;border-radius:14px;border:none;font-size:15px;
    font-weight:700;font-family:inherit;cursor:pointer;
  }
  .btn-go{background:var(--accent);color:var(--paid-ink)}
  .btn-no{background:var(--card2);color:var(--txt)}
  .btn:active{opacity:.75}

  /* ---- teclado ---- */
  .padamt{text-align:center;font-size:44px;font-weight:800;letter-spacing:-1.8px;padding:8px 0 4px;line-height:1.1}
  .padamt.empty{color:var(--dim)}
  .padmeta{display:flex;gap:10px;margin:8px 0 12px}
  .chip{
    flex:1;position:relative;min-height:44px;border-radius:12px;background:var(--card2);
    border:none;color:var(--txt);font-size:13px;font-weight:600;
    font-family:inherit;display:flex;align-items:center;justify-content:center;
    gap:6px;cursor:pointer;overflow:hidden;padding:0 8px;
  }
  .chip:active{background:var(--line)}
  .chip input[type=date]{
    position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;
    border:none;padding:0;background:transparent;
  }
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .key{
    min-height:52px;border-radius:13px;background:var(--card2);border:none;
    color:var(--txt);font-size:23px;font-weight:600;font-family:inherit;cursor:pointer;
  }
  .key:active{background:var(--line)}

  /* ---- menú ---- */
  .menu-item{
    display:flex;align-items:center;gap:14px;padding:13px 2px;
    border-bottom:1px solid var(--line);cursor:pointer;
  }
  .menu-item:active{opacity:.6}
  .menu-ico{font-size:19px;width:26px;text-align:center;flex-shrink:0}
  .menu-txt{flex:1;min-width:0}
  .menu-t{display:block;font-size:15px;font-weight:600}
  .menu-d{display:block;font-size:11px;color:var(--dim);margin-top:2px;line-height:1.4}
  .langrow{display:flex;gap:10px;padding:2px 0 14px;border-bottom:1px solid var(--line)}
  .langrow button{
    flex:1;min-height:46px;border-radius:12px;border:none;
    background:var(--card2);color:var(--dim);font-size:14px;font-weight:700;
    font-family:inherit;cursor:pointer;
  }
  .langrow button.on{background:var(--accent);color:var(--paid-ink)}

  .toast{
    position:fixed;left:14px;right:14px;bottom:calc(var(--safe-b) + 96px);
    background:var(--txt);color:var(--bg);padding:14px;border-radius:13px;
    font-weight:700;text-align:center;z-index:100;opacity:0;pointer-events:none;
    transition:opacity .25s;font-size:15px;
  }
  .toast.on{opacity:1}

  .warn{
    background:rgba(255,95,95,.12);border:1px solid rgba(255,95,95,.3);
    color:#FFB3B3;padding:11px;border-radius:10px;font-size:12px;
    margin-top:14px;line-height:1.5;
  }
</style>
</head>
<body>

<!-- LISTA -->
<div class="screen on" id="s-list">
  <header>
    <button class="ico" onclick="openMenu()">⋯</button>
    <div class="topsum">
      <span class="topsum-lbl" data-t="totalOwed">Total:</span>
      <span class="topsum-amt" id="grand">$0.00</span>
    </div>
  </header>
  <div class="searchwrap" id="searchwrap">
    <input type="text" id="search" data-tph="search" placeholder="Buscar por nombre…" autocomplete="off" oninput="render()">
  </div>
  <div class="fabhost">
    <div class="scroll" id="list"></div>
    <button class="fab" onclick="openPerson()">＋</button>
  </div>
</div>

<!-- DETALLE -->
<div class="screen" id="s-det">
  <header>
    <button class="ico" onclick="show('s-list');render()">‹</button>
    <h2 id="d-name">—</h2>
    <button class="ico" onclick="openPerson(cur)">✎</button>
    <button class="ico danger" onclick="delPerson()">🗑</button>
  </header>
  <div class="scroll">
    <div class="hero">
      <div class="hero-lbl" data-t="owesMeNow">Me debe ahora</div>
      <div class="hero-amt" id="d-bal">$0.00</div>
      <div class="hero-sub" id="d-note"></div>
    </div>
    <div class="divider"></div>
    <div class="sect" data-t="history">Todo lo que ha pasado</div>
    <div id="movs"></div>
  </div>
  <div class="footbar">
    <div class="acts">
      <button class="act act-lent" onclick="openPad(cur.id,'up')">
        <b data-t="gaveShort">Le di dinero</b><i data-t="gaveEffect">Sube lo que debe</i>
      </button>
      <button class="act act-paid" onclick="openPad(cur.id,'down')">
        <b data-t="gotShort">Me pagó</b><i data-t="gotEffect">Baja lo que debe</i>
      </button>
    </div>
  </div>
</div>

<!-- HOJA: TECLADO -->
<div class="sheet" id="sh-pad">
  <div class="sheet-in">
    <div class="sheet-top">
      <div class="sheet-h" id="pad-who">—</div>
      <button class="ico" onclick="closeAll()">✕</button>
    </div>
    <div class="padamt empty" id="pad-amt">$0</div>
    <div class="padmeta">
      <div class="chip" id="pad-datechip">
        <span id="pad-datetxt">hoy</span>
        <input type="date" id="pad-date" onchange="padDateChanged()">
      </div>
      <button class="chip" id="pad-notebtn" onclick="toggleNote()">＋ <span data-t="addNote">Nota</span></button>
    </div>
    <input type="text" id="pad-note" data-tph="movNotePh" placeholder="Efectivo, Zelle…" autocomplete="off" style="display:none">
    <div class="pad">
      <button class="key" onclick="padKey('1')">1</button>
      <button class="key" onclick="padKey('2')">2</button>
      <button class="key" onclick="padKey('3')">3</button>
      <button class="key" onclick="padKey('4')">4</button>
      <button class="key" onclick="padKey('5')">5</button>
      <button class="key" onclick="padKey('6')">6</button>
      <button class="key" onclick="padKey('7')">7</button>
      <button class="key" onclick="padKey('8')">8</button>
      <button class="key" onclick="padKey('9')">9</button>
      <button class="key" onclick="padKey('.')">.</button>
      <button class="key" onclick="padKey('0')">0</button>
      <button class="key" onclick="padKey('back')">⌫</button>
    </div>
    <div class="acts">
      <button class="act act-lent" id="pad-lent" onclick="savePad('up')">
        <b data-t="borrowed">Prestado</b>
      </button>
      <button class="act act-paid" id="pad-paid" onclick="savePad('down')">
        <b data-t="paidBtn">Pagado</b>
      </button>
    </div>
  </div>
</div>

<!-- HOJA: PERSONA -->
<div class="sheet" id="sh-person">
  <div class="sheet-in">
    <div class="sheet-h" id="p-title">Agregar persona</div>
    <label data-t="name">Nombre</label>
    <input type="text" id="p-name" data-tph="namePh" placeholder="Juan" autocomplete="off">
    <label data-t="noteOpt">Nota (opcional)</label>
    <input type="text" id="p-note" data-tph="personNotePh" placeholder="Teléfono, dirección…" autocomplete="off">
    <div class="btns">
      <button class="btn btn-no" data-t="cancel" onclick="closeAll()">Cancelar</button>
      <button class="btn btn-go" data-t="save" onclick="savePerson()">Guardar</button>
    </div>
  </div>
</div>

<!-- HOJA: MENU -->
<div class="sheet" id="sh-menu">
  <div class="sheet-in">
    <div class="sheet-h" data-t="options">Opciones</div>
    <div class="langrow">
      <button id="lang-es" onclick="setLang('es')">Español</button>
      <button id="lang-en" onclick="setLang('en')">English</button>
    </div>
    <div class="menu-item" onclick="backup()">
      <span class="menu-ico">💾</span>
      <span class="menu-txt"><span class="menu-t" data-t="mBackup">Copia de seguridad</span><span class="menu-d" data-t="mBackupD">Archivo para volver a cargar en la app</span></span>
    </div>
    <div class="menu-item" onclick="exportText()">
      <span class="menu-ico">📄</span>
      <span class="menu-txt"><span class="menu-t" data-t="mExport">Exportar lista</span><span class="menu-d" data-t="mExportD">Texto para leer, imprimir o enviar</span></span>
    </div>
    <div class="menu-item" onclick="document.getElementById('file').click()">
      <span class="menu-ico">📂</span>
      <span class="menu-txt"><span class="menu-t" data-t="mRestore">Restaurar desde copia</span><span class="menu-d" data-t="mRestoreD">Reemplaza todo con un archivo de copia</span></span>
    </div>
    <div class="warn" id="bk-warn"></div>
    <div class="btns" style="margin-top:16px">
      <button class="btn btn-no" data-t="close" onclick="closeAll()">Cerrar</button>
    </div>
  </div>
</div>

<input type="file" id="file" accept=".json,application/json" style="display:none" onchange="restore(event)">
<div class="toast" id="toast"></div>

<script>
/* ---------- TEXTOS / STRINGS ---------- */
const T={

    confirmDelPerson:n=>'¿Borrar a '+n+' y todo lo anotado de esta persona?',
    confirmDelMov:'¿Borrar este apunte?',

    exSettled:'Ya no me debe nada', exNone:'(nada anotado)',
    exTotal:'TOTAL QUE ME DEBEN: ', exPeople:'Personas en la lista: ',
    exNobody:'Todavía no hay nadie en la lista.'
  },

    newPerson:'Add person', editPerson:'Change details',
    name:'Name', namePh:'John',
    noteOpt:'Note (optional)', personNotePh:'Phone, address…',
    addNote:'Note', movNotePh:'Cash, Zelle…',
    today:'today', cancel:'Cancel', save:'Save', close:'Close',
    options:'Options',
    mBackup:'Backup file', mBackupD:'File to load back into the app',
    mExport:'Export list', mExportD:'Plain text to read, print or send',
    mRestore:'Restore from backup', mRestoreD:'Replaces everything with a backup file',
    noBackupYet:'You have not saved a backup yet. Everything lives only on this phone.',
    lastBackup:(d,n)=>'Last backup: '+d+'. Entries added since then: '+n+'.',
    confirmDelPerson:n=>'Delete '+n+' and everything written down for them?',
    confirmDelMov:'Delete this entry?',
    confirmRestore:'This replaces everything you have now. Continue?',
    needName:'Enter a name', needAmount:'Enter how much',
    saveFail:'Could not save', restored:'Everything was restored',
    badFile:'That file does not work',
    backupHint:'Choose "Save to Files" → iCloud Drive',
    exportHint:'Choose "Save to Files" or share it',
    rememberBackup:'Remember to save a backup',
    savedGave:m=>'Written down: you gave '+m, savedGot:m=>'Written down: they paid '+m,
    months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
    /* export */
    exTitle:'WHO OWES ME', exMadeOn:'Made on ', exOwes:'Owes me: ',
    exSettled:'Owes me nothing', exNone:'(nothing written down)',
    exTotal:'TOTAL OWED TO ME: ', exPeople:'People on the list: ',
    exNobody:'Nobody on the list yet.'
  }
};
function t(k){return T[db.lang||'es'][k];}

/* ---------- DATOS ---------- */
const KEY='pagos_v1';
let db={people:[],lastBackup:null,sinceBackup:0,lang:'es'};
let cur=null, editId=null;
let padPerson=null, padVal='';

function load(){
  try{const r=localStorage.getItem(KEY); if(r) db=JSON.parse(r);}catch(e){}
  if(!db.people) db.people=[];
  if(db.sinceBackup==null) db.sinceBackup=0;
  if(db.lang!=='en') db.lang='es';
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));}
  catch(e){toast(t('saveFail'));}
}
function money(n){
  return '$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function balance(p){
  return p.movs.reduce((s,m)=>s+(m.kind==='up'?m.amt:-m.amt),0);
}
function fdate(iso){
  const [y,m,d]=iso.split('-').map(Number);
  return db.lang==='en' ? t('months')[m-1]+' '+d+', '+y : d+' '+t('months')[m-1]+' '+y;
}
/* hora del este, 12 horas con AM/PM */
function ftime(ts){
  try{
    return new Date(ts).toLocaleString('en-US',
      {timeZone:'America/New_York',hour:'numeric',minute:'2-digit',hour12:true});
  }catch(e){return '';}
}
/* fecha, y la hora exacta si el apunte la tiene guardada */
function fwhen(m){
  const d=fdate(m.date);
  const h=m.ts?ftime(m.ts):'';
  return h?d+' · '+h:d;
}
function today(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
function closeAll(){document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('on'));}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'),2400);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- IDIOMA ---------- */
function applyLang(){
  document.documentElement.lang=db.lang;
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t);});
  document.querySelectorAll('[data-tph]').forEach(el=>{el.placeholder=t(el.dataset.tph);});
  document.getElementById('lang-es').classList.toggle('on',db.lang==='es');
  document.getElementById('lang-en').classList.toggle('on',db.lang==='en');
}
function setLang(l){
  db.lang=l; save(); applyLang(); render();
  if(cur && document.getElementById('s-det').classList.contains('on')) openDetail(cur.id);
  openMenu();
}

/* ---------- LISTA ---------- */
function render(){
  const list=document.getElementById('list');
  const q=document.getElementById('search').value.trim().toLowerCase();
  document.getElementById('searchwrap').classList.toggle('on',db.people.length>6);
  if(db.people.length<=6) document.getElementById('search').value='';

  const all=[...db.people].filter(p=>!q||p.name.toLowerCase().includes(q));
  const owing=all.filter(p=>balance(p)>0).sort((a,b)=>balance(b)-balance(a));
  const clear=all.filter(p=>balance(p)<=0).sort((a,b)=>a.name.localeCompare(b.name));

  let html='';
  if(!db.people.length){
    html='<div class="empty">'+t('emptyList')+'</div>';
  }else if(!all.length){
    html='<div class="empty">'+t('noResults')+'</div>';
  }else{
    if(owing.length){
      html+='<div class="sect">'+t('owing')+'</div>';
      html+=owing.map((p,i)=>cardHtml(p,i===0&&!q,false)).join('');
    }
    if(clear.length){
      html+='<div class="sect">'+t('settled')+'</div>';
      html+=clear.map(p=>cardHtml(p,false,true)).join('');
    }
  }
  list.innerHTML=html;
  document.getElementById('grand').textContent=money(db.people.reduce((s,p)=>s+Math.max(0,balance(p)),0));
}
function cardHtml(p,isTop,isClear){
  const b=balance(p);
  const over=b<0;                      /* pagó de más */
  const last=p.movs.length?p.movs[p.movs.length-1].date:null;
  let foot;
  if(over)            foot='<div class="badge">'+t('overpaid')+'</div>';
  else if(!isClear)   foot='<div class="c-sub">'+(last?t('lastMov')(fdate(last)):t('noMovs'))+'</div>';
  else if(p.movs.length) foot='<div class="badge">✓ '+t('settledBadge')+'</div>';
  else                foot='<div class="badge">'+t('noMovs')+'</div>';
  const strip=b>0?'owes':(over?'over':'');
  return `<div class="card ${strip} ${isTop?'top':''} ${isClear&&!over?'clear':''}">
    <div class="strip"></div>
    <div class="card-tap" onclick="openDetail('${p.id}')">
      <div class="c-name">${esc(p.name)}</div>
      <div class="c-amt">${money(b)}</div>
      ${foot}
    </div>
    <button class="plus" onclick="openPad('${p.id}')">＋</button>
  </div>`;
}

/* ---------- DETALLE ---------- */
function openDetail(id){
  cur=db.people.find(p=>p.id===id); if(!cur) return;
  const b=balance(cur);
  document.getElementById('d-name').textContent=cur.name;
  const bal=document.getElementById('d-bal');
  bal.textContent=money(b);
  bal.classList.toggle('zero',b===0);
  bal.classList.toggle('over',b<0);
  document.querySelector('#s-det .hero-lbl').textContent=b<0?t('overpaid'):t('owesMeNow');
  const bits=[];
  if(b<0) bits.push(t('overpaidBy')(money(b)));
  else if(b===0&&cur.movs.length) bits.push(t('exSettled'));
  if(cur.note) bits.push(cur.note);
  document.getElementById('d-note').textContent=bits.join(' · ');
  const box=document.getElementById('movs');
  const ms=[...cur.movs].sort((a,b2)=>b2.date.localeCompare(a.date));
  box.innerHTML=ms.length?ms.map(m=>`
    <div class="mv">
      <div class="tag ${m.kind}">${m.kind==='up'?'↑':'↓'}</div>
      <div class="mv-mid">
        <div class="mv-kind ${m.kind}">${m.kind==='up'?t('gaveLong'):t('gotLong')}</div>
        <div class="mv-eff">${m.kind==='up'?t('gaveEffect'):t('gotEffect')}</div>
        <div class="mv-date">${fwhen(m)}${m.note?' · '+esc(m.note):''}</div>
      </div>
      <div class="mv-amt ${m.kind}">${m.kind==='up'?'+':'−'}${money(m.amt)}</div>
      <button class="mv-del" onclick="delMov('${m.id}')">×</button>
    </div>`).join('')
    :'<div class="empty">'+t('emptyMovs')+'</div>';
  show('s-det');
}

/* ---------- PERSONA ---------- */
function openPerson(p){
  editId=p?p.id:null;
  document.getElementById('p-title').textContent=p?t('editPerson'):t('newPerson');
  document.getElementById('p-name').value=p?p.name:'';
  document.getElementById('p-note').value=p&&p.note?p.note:'';
  document.getElementById('sh-person').classList.add('on');
  setTimeout(()=>document.getElementById('p-name').focus(),150);
}
function savePerson(){
  const n=document.getElementById('p-name').value.trim();
  if(!n){toast(t('needName'));return;}
  const note=document.getElementById('p-note').value.trim();
  const wasEdit=editId;
  if(wasEdit){
    const p=db.people.find(x=>x.id===wasEdit);
    p.name=n; p.note=note;
  }else{
    db.people.push({id:String(Date.now()),name:n,note:note,movs:[]});
  }
  save(); closeAll(); render();
  editId=null;
  if(wasEdit&&cur) openDetail(wasEdit);
}
function delPerson(){
  if(!cur) return;
  if(!confirm(t('confirmDelPerson')(cur.name))) return;
  db.people=db.people.filter(p=>p.id!==cur.id);
  save(); cur=null; show('s-list'); render();
}

/* ---------- TECLADO ---------- */
function openPad(id,kind){
  padPerson=db.people.find(p=>p.id===id); if(!padPerson) return;
  padVal='';
  /* si ya se eligió la acción, solo se muestra ese botón */
  document.getElementById('pad-lent').style.display=(kind==='down')?'none':'';
  document.getElementById('pad-paid').style.display=(kind==='up')?'none':'';
  document.getElementById('pad-who').textContent=padPerson.name;
  document.getElementById('pad-date').value=today();
  document.getElementById('pad-datetxt').textContent=t('today');
  const note=document.getElementById('pad-note');
  note.value=''; note.style.display='none';
  document.getElementById('pad-notebtn').style.display='';
  padDraw();
  document.getElementById('sh-pad').classList.add('on');
}
function padDraw(){
  const el=document.getElementById('pad-amt');
  el.classList.toggle('empty',!padVal);
  if(!padVal){el.textContent='$0';return;}
  const parts=padVal.split('.');
  const int=Number(parts[0]||0).toLocaleString('en-US');
  el.textContent='$'+int+(parts.length>1?'.'+parts[1]:'');
}
function padKey(k){
  if(k==='back'){padVal=padVal.slice(0,-1);}
  else if(k==='.'){if(!padVal.includes('.')) padVal=(padVal||'0')+'.';}
  else{
    const d=padVal.split('.');
    if(d.length>1&&d[1].length>=2) return;
    if(d[0].length>=9&&d.length===1) return;
    padVal+=k;
  }
  padDraw();
}
function padDateChanged(){
  const v=document.getElementById('pad-date').value;
  document.getElementById('pad-datetxt').textContent=(!v||v===today())?t('today'):fdate(v);
}
function toggleNote(){
  const n=document.getElementById('pad-note');
  n.style.display='';
  document.getElementById('pad-notebtn').style.display='none';
  setTimeout(()=>n.focus(),50);
}
function savePad(kind){
  const amt=Math.round(parseFloat(padVal||'0')*100)/100;
  if(!amt||amt<=0||isNaN(amt)){toast(t('needAmount'));return;}
  padPerson.movs.push({
    id:String(Date.now()),kind:kind,amt:amt,
    ts:Date.now(),
    date:document.getElementById('pad-date').value||today(),
    note:document.getElementById('pad-note').value.trim()
  });
  db.sinceBackup++;
  save(); closeAll(); render();
  if(cur&&cur.id===padPerson.id&&document.getElementById('s-det').classList.contains('on')) openDetail(cur.id);
  toast(kind==='up'?t('savedGave')(money(amt)):t('savedGot')(money(amt)));
  if(db.sinceBackup>=10) setTimeout(()=>toast(t('rememberBackup')),2600);
}
function delMov(id){
  if(!confirm(t('confirmDelMov'))) return;
  cur.movs=cur.movs.filter(m=>m.id!==id);
  save(); openDetail(cur.id); render();
}

/* ---------- MENU / ARCHIVOS ---------- */
function openMenu(){
  const w=document.getElementById('bk-warn');
  w.textContent=db.lastBackup ? t('lastBackup')(fdate(db.lastBackup),db.sinceBackup) : t('noBackupYet');
  document.getElementById('sh-menu').classList.add('on');
}
function download(text,filename,mime){
  const blob=new Blob([text],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function backup(){
  download(JSON.stringify(db,null,2),'pagos-copia-'+today()+'.json','application/json');
  db.lastBackup=today(); db.sinceBackup=0; save();
  closeAll(); toast(t('backupHint'));
}
function exportText(){
  const L='------------------------------------';
  const D='====================================';
  const out=[];
  out.push(t('exTitle'));
  out.push(t('exMadeOn')+fdate(today()));
  out.push('');
  const people=[...db.people].sort((a,b)=>balance(b)-balance(a));
  if(!people.length){
    out.push(t('exNobody'));
  }else{
    people.forEach(p=>{
      const b=balance(p);
      out.push(L);
      out.push(p.name.toUpperCase());
      if(p.note) out.push('('+p.note+')');
      out.push(b>0 ? t('exOwes')+money(b)
             : b<0 ? t('overpaidBy')(money(b))
             : (p.movs.length?t('exSettled'):t('noMovs')));
      out.push('');
      const ms=[...p.movs].sort((a,b2)=>a.date.localeCompare(b2.date));
      if(!ms.length){
        out.push('   '+t('exNone'));
      }else{
        ms.forEach(m=>{
          const sign=(m.kind==='up'?'+':'-')+money(m.amt);
          const what=m.kind==='up'?t('gaveLong'):t('gotLong');
          out.push('   '+sign.padEnd(13,' ')+fdate(m.date).padEnd(15,' ')+what+(m.note?' ('+m.note+')':''));
        });
      }
      out.push('');
    });
    out.push(D);
    out.push(t('exTotal')+money(db.people.reduce((s,p)=>s+Math.max(0,balance(p)),0)));
    out.push(t('exPeople')+db.people.length);
    out.push(D);
  }
  download(out.join('\r\n')+'\r\n','pagos-lista-'+today()+'.txt','text/plain;charset=utf-8');
  closeAll(); toast(t('exportHint'));
}
function restore(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.people) throw 0;
      if(!confirm(t('confirmRestore'))) return;
      const keepLang=db.lang;
      db=d;
      if(db.sinceBackup==null) db.sinceBackup=0;
      if(db.lang!=='en'&&db.lang!=='es') db.lang=keepLang;
      save(); closeAll(); show('s-list'); applyLang(); render(); toast(t('restored'));
    }catch(err){toast(t('badFile'));}
  };
  r.readAsText(f);
  e.target.value='';
}

document.querySelectorAll('.sheet').forEach(s=>{
  s.addEventListener('click',ev=>{if(ev.target===s) closeAll();});
});

load(); applyLang(); render();
</script>
</body>
</html>
