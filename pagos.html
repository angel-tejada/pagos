<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pagos">
<meta name="theme-color" content="#0E1116">
<title>Pagos</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230E1116'/%3E%3Ctext x='90' y='122' font-family='Helvetica' font-size='100' font-weight='bold' fill='%232DD4A7' text-anchor='middle'%3E%24%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0E1116; --card:#181D25; --card2:#222933; --line:#333D4A;
    --txt:#FFFFFF; --dim:#9AA7B6;
    --paid:#2DD4A7; --paid-ink:#06231B;
    --lent:#FF5F5F; --lent-ink:#2A0A0A;
    --accent:#2DD4A7;
    --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{
    background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;
  }
  .screen{display:none;flex-direction:column;height:100vh;height:100dvh}
  .screen.on{display:flex}

  header{
    padding:calc(var(--safe-t) + 12px) 16px 12px;
    display:flex;align-items:center;gap:10px;flex-shrink:0;
    border-bottom:1px solid var(--line);
  }
  h1{font-size:30px;font-weight:800;letter-spacing:-.5px;flex:1}
  h2{font-size:21px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ico{
    width:56px;height:56px;border-radius:16px;background:var(--card2);
    display:flex;align-items:center;justify-content:center;
    font-size:24px;flex-shrink:0;border:none;color:var(--txt);cursor:pointer;
  }
  .ico:active{background:var(--line)}
  .ico.danger{color:var(--lent)}

  .searchwrap{padding:12px 16px;border-bottom:1px solid var(--line);display:none}
  .searchwrap.on{display:block}
  .searchwrap input{margin:0}

  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:130px}

  .row{
    display:flex;align-items:center;gap:14px;padding:14px 12px 14px 16px;
    border-bottom:1px solid var(--line);
  }
  .row-tap{display:flex;align-items:center;gap:14px;flex:1;min-width:0;cursor:pointer;padding:4px 0}
  .row-tap:active{opacity:.6}
  .av{
    width:52px;height:52px;border-radius:26px;background:var(--card2);
    color:var(--txt);display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;flex-shrink:0;
  }
  .row.top .av{background:var(--paid);color:var(--paid-ink)}
  .row.top{background:linear-gradient(90deg,rgba(45,212,167,.07),transparent)}
  .row-mid{flex:1;min-width:0}
  .row-name{font-size:16px;font-weight:600;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row-amt{font-size:32px;font-weight:800;color:var(--paid);letter-spacing:-1px;margin-top:1px}
  .row-sub{font-size:13px;color:var(--dim);margin-top:2px}
  .row.top .row-amt{font-size:38px}
  .row.clear .av{opacity:.45}
  .row.clear .row-amt{font-size:22px;color:var(--dim)}
  .badge{
    display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;
    color:var(--dim);background:var(--card2);padding:4px 10px;border-radius:20px;margin-top:4px;
  }
  .plus{
    width:60px;height:60px;border-radius:18px;background:var(--card2);
    border:1px solid var(--line);color:var(--txt);font-size:32px;font-weight:300;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;
  }
  .plus:active{background:var(--line)}

  .total{
    position:fixed;left:0;right:0;bottom:0;
    padding:14px 20px calc(var(--safe-b) + 14px);
    background:var(--card);border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;z-index:4;
  }
  .total-lbl{font-size:14px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .total-amt{font-size:32px;font-weight:800;color:var(--paid);letter-spacing:-1px}

  .fab{
    position:fixed;right:16px;bottom:calc(var(--safe-b) + 96px);
    width:64px;height:64px;border-radius:20px;background:var(--card2);
    border:1px solid var(--line);
    color:var(--txt);font-size:34px;font-weight:300;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 20px rgba(0,0,0,.5);cursor:pointer;z-index:5;
  }
  .fab:active{transform:scale(.94)}

  .hero{padding:22px 20px;text-align:center;border-bottom:1px solid var(--line)}
  .hero-lbl{font-size:14px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:1px}
  .hero-amt{font-size:56px;font-weight:800;color:var(--paid);margin-top:4px;letter-spacing:-2px;line-height:1.05}
  .hero-amt.zero{color:var(--dim)}
  .hero-sub{font-size:15px;color:var(--dim);margin-top:6px}

  .sect{padding:22px 16px 8px;font-size:13px;color:var(--dim);font-weight:800;text-transform:uppercase;letter-spacing:1.2px}

  .empty{padding:60px 30px;text-align:center;color:var(--dim);font-size:16px;line-height:1.6}

  .mv{display:flex;align-items:center;gap:12px;padding:14px 12px 14px 16px;border-bottom:1px solid var(--line)}
  .tag{
    width:44px;height:44px;border-radius:14px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;
  }
  .tag.up{background:rgba(255,95,95,.16);color:var(--lent)}
  .tag.down{background:rgba(45,212,167,.16);color:var(--paid)}
  .mv-mid{flex:1;min-width:0}
  .mv-kind{font-size:15px;font-weight:700}
  .mv-kind.up{color:var(--lent)}
  .mv-kind.down{color:var(--paid)}
  .mv-date{font-size:14px;color:var(--dim);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mv-amt{font-size:24px;font-weight:800;flex-shrink:0;letter-spacing:-.5px}
  .mv-amt.up{color:var(--lent)}
  .mv-amt.down{color:var(--paid)}
  .mv-del{
    width:48px;height:48px;border-radius:14px;background:transparent;border:none;
    color:var(--dim);font-size:22px;flex-shrink:0;cursor:pointer;
  }
  .mv-del:active{background:var(--card2)}

  .actbar{
    position:fixed;left:0;right:0;bottom:0;z-index:5;
    padding:12px 16px calc(var(--safe-b) + 12px);
    background:var(--card);border-top:1px solid var(--line);
    display:flex;gap:12px;
  }
  .act{
    flex:1;min-height:66px;border-radius:18px;border:none;cursor:pointer;
    font-family:inherit;font-size:19px;font-weight:800;letter-spacing:.3px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .act:active{opacity:.75}
  .act .arrow{font-size:22px}
  .act-lent{background:var(--lent);color:var(--lent-ink)}
  .act-paid{background:var(--paid);color:var(--paid-ink)}

  .sheet{
    position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;
    display:none;align-items:flex-end;
  }
  .sheet.on{display:flex}
  .sheet-in{
    width:100%;background:var(--card);border-radius:24px 24px 0 0;
    padding:20px 16px calc(var(--safe-b) + 16px);max-height:96vh;overflow-y:auto;
  }
  .sheet-h{font-size:21px;font-weight:800;margin-bottom:16px}
  .sheet-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .sheet-top .sheet-h{flex:1;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  label{display:block;font-size:13px;color:var(--dim);font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.6px}
  input{
    width:100%;padding:16px;background:var(--card2);border:1px solid var(--line);
    border-radius:14px;color:var(--txt);font-size:18px;font-family:inherit;
    margin-bottom:18px;-webkit-appearance:none;
  }
  input:focus{outline:none;border-color:var(--accent)}
  .btns{display:flex;gap:12px;margin-top:6px}
  .btn{
    flex:1;min-height:60px;border-radius:16px;border:none;font-size:17px;
    font-weight:700;font-family:inherit;cursor:pointer;
  }
  .btn-go{background:var(--accent);color:var(--paid-ink)}
  .btn-no{background:var(--card2);color:var(--txt)}
  .btn:active{opacity:.75}

  /* keypad sheet */
  .padamt{
    text-align:center;font-size:56px;font-weight:800;letter-spacing:-2px;
    padding:10px 0 4px;line-height:1.1;
  }
  .padamt.empty{color:var(--dim)}
  .padmeta{display:flex;gap:10px;margin:8px 0 14px}
  .chip{
    flex:1;position:relative;min-height:50px;border-radius:14px;background:var(--card2);
    border:1px solid var(--line);color:var(--txt);font-size:15px;font-weight:600;
    font-family:inherit;display:flex;align-items:center;justify-content:center;
    gap:6px;cursor:pointer;overflow:hidden;padding:0 8px;
  }
  .chip:active{background:var(--line)}
  .chip input[type=date]{
    position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;
    border:none;padding:0;background:transparent;
  }
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .key{
    min-height:62px;border-radius:16px;background:var(--card2);border:1px solid var(--line);
    color:var(--txt);font-size:28px;font-weight:600;font-family:inherit;cursor:pointer;
  }
  .key:active{background:var(--line)}
  .key.wide{grid-column:span 1}

  .menu-item{
    display:flex;align-items:center;gap:14px;padding:20px 4px;
    border-bottom:1px solid var(--line);font-size:17px;cursor:pointer;
  }
  .menu-item:active{opacity:.6}
  .menu-item span:first-child{font-size:22px;width:30px}
  .langrow{display:flex;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
  .langrow button{
    flex:1;min-height:56px;border-radius:14px;border:1px solid var(--line);
    background:var(--card2);color:var(--dim);font-size:16px;font-weight:700;
    font-family:inherit;cursor:pointer;
  }
  .langrow button.on{background:var(--accent);color:var(--paid-ink);border-color:var(--accent)}

  .toast{
    position:fixed;left:16px;right:16px;bottom:calc(var(--safe-b) + 110px);
    background:var(--txt);color:var(--bg);padding:18px;border-radius:16px;
    font-weight:700;text-align:center;z-index:100;opacity:0;pointer-events:none;
    transition:opacity .25s;font-size:17px;
  }
  .toast.on{opacity:1}

  .warn{
    background:rgba(255,95,95,.12);border:1px solid rgba(255,95,95,.3);
    color:#FFB3B3;padding:14px;border-radius:12px;font-size:14px;
    margin-bottom:6px;line-height:1.5;
  }
</style>
</head>
<body>

<!-- LISTA -->
<div class="screen on" id="s-list">
  <header>
    <h1 data-t="debtors">Deudores</h1>
    <button class="ico" onclick="openMenu()">⋯</button>
  </header>
  <div class="searchwrap" id="searchwrap">
    <input type="text" id="search" data-tph="search" placeholder="Buscar…" autocomplete="off" oninput="render()">
  </div>
  <div class="scroll" id="list"></div>
  <div class="total">
    <span class="total-lbl" data-t="totalOwed">Total por cobrar</span>
    <span class="total-amt" id="grand">$0.00</span>
  </div>
  <button class="fab" onclick="openPerson()">＋</button>
</div>

<!-- DETALLE -->
<div class="screen" id="s-det">
  <header>
    <button class="ico" onclick="show('s-list');render()">‹</button>
    <h2 id="d-name">—</h2>
    <button class="ico" onclick="openPerson(cur)">✎</button>
    <button class="ico danger" onclick="delPerson()">🗑</button>
  </header>
  <div class="scroll">
    <div class="hero">
      <div class="hero-lbl" data-t="owes">Debe</div>
      <div class="hero-amt" id="d-bal">$0.00</div>
      <div class="hero-sub" id="d-note"></div>
    </div>
    <div class="sect" data-t="activity">Movimientos</div>
    <div id="movs"></div>
  </div>
  <div class="actbar">
    <button class="act act-lent" onclick="openPad(cur.id,'up')"><span class="arrow">↑</span><span data-t="lent">Prestó</span></button>
    <button class="act act-paid" onclick="openPad(cur.id,'down')"><span class="arrow">↓</span><span data-t="paid">Pagó</span></button>
  </div>
</div>

<!-- SHEET: TECLADO / MONTO -->
<div class="sheet" id="sh-pad">
  <div class="sheet-in">
    <div class="sheet-top">
      <div class="sheet-h" id="pad-who">—</div>
      <button class="ico" onclick="closeAll()">✕</button>
    </div>
    <div class="padamt empty" id="pad-amt">$0</div>
    <div class="padmeta">
      <div class="chip" id="pad-datechip">
        <span id="pad-datetxt">hoy</span>
        <input type="date" id="pad-date" onchange="padDateChanged()">
      </div>
      <button class="chip" id="pad-notebtn" onclick="toggleNote()">＋ <span data-t="addNote">Nota</span></button>
    </div>
    <input type="text" id="pad-note" data-tph="movNotePh" placeholder="Efectivo, Zelle…" autocomplete="off" style="display:none">
    <div class="pad">
      <button class="key" onclick="padKey('1')">1</button>
      <button class="key" onclick="padKey('2')">2</button>
      <button class="key" onclick="padKey('3')">3</button>
      <button class="key" onclick="padKey('4')">4</button>
      <button class="key" onclick="padKey('5')">5</button>
      <button class="key" onclick="padKey('6')">6</button>
      <button class="key" onclick="padKey('7')">7</button>
      <button class="key" onclick="padKey('8')">8</button>
      <button class="key" onclick="padKey('9')">9</button>
      <button class="key" onclick="padKey('.')">.</button>
      <button class="key" onclick="padKey('0')">0</button>
      <button class="key" onclick="padKey('back')">⌫</button>
    </div>
    <div class="btns">
      <button class="act act-lent" onclick="savePad('up')"><span class="arrow">↑</span><span data-t="lent">Prestó</span></button>
      <button class="act act-paid" onclick="savePad('down')"><span class="arrow">↓</span><span data-t="paid">Pagó</span></button>
    </div>
  </div>
</div>

<!-- SHEET: PERSONA -->
<div class="sheet" id="sh-person">
  <div class="sheet-in">
    <div class="sheet-h" id="p-title">Nuevo deudor</div>
    <label data-t="name">Nombre</label>
    <input type="text" id="p-name" data-tph="namePh" placeholder="Juan" autocomplete="off">
    <label data-t="noteOpt">Nota (opcional)</label>
    <input type="text" id="p-note" data-tph="personNotePh" placeholder="Teléfono, dirección…" autocomplete="off">
    <div class="btns">
      <button class="btn btn-no" data-t="cancel" onclick="closeAll()">Cancelar</button>
      <button class="btn btn-go" data-t="save" onclick="savePerson()">Guardar</button>
    </div>
  </div>
</div>

<!-- SHEET: MENU -->
<div class="sheet" id="sh-menu">
  <div class="sheet-in">
    <div class="sheet-h" data-t="options">Opciones</div>
    <div class="langrow">
      <button id="lang-es" onclick="setLang('es')">Español</button>
      <button id="lang-en" onclick="setLang('en')">English</button>
    </div>
    <div class="menu-item" onclick="backup()"><span>💾</span><span data-t="saveBackup">Guardar copia de seguridad</span></div>
    <div class="menu-item" onclick="document.getElementById('file').click()"><span>📂</span><span data-t="restoreBackup">Restaurar desde copia</span></div>
    <div class="warn" id="bk-warn" style="margin-top:16px"></div>
    <div class="btns" style="margin-top:14px">
      <button class="btn btn-no" data-t="close" onclick="closeAll()">Cerrar</button>
    </div>
  </div>
</div>

<input type="file" id="file" accept=".json,application/json" style="display:none" onchange="restore(event)">
<div class="toast" id="toast"></div>

<script>
/* ---------- TEXTOS / STRINGS ---------- */
const T={
  es:{
    debtors:'Deudores', totalOwed:'Total por cobrar', search:'Buscar…',
    owing:'Deben', settled:'Al día', settledBadge:'Al día',
    emptyList:'Todavía no hay deudores.<br>Toca ＋ para agregar uno.',
    noResults:'Nadie con ese nombre.',
    noMovs:'Sin movimientos', owes:'Debe', activity:'Movimientos',
    emptyMovs:'Sin movimientos todavía.',
    lent:'Prestó', paid:'Pagó',
    newPerson:'Nuevo deudor', editPerson:'Editar deudor',
    name:'Nombre', namePh:'Juan',
    noteOpt:'Nota (opcional)', personNotePh:'Teléfono, dirección…',
    addNote:'Nota', movNotePh:'Efectivo, Zelle…',
    today:'hoy', cancel:'Cancelar', save:'Guardar', close:'Cerrar',
    options:'Opciones', language:'Idioma',
    saveBackup:'Guardar copia de seguridad', restoreBackup:'Restaurar desde copia',
    noBackupYet:'Todavía no has guardado ninguna copia. Los datos viven solo en este teléfono.',
    lastBackup:(d,n)=>'Última copia: '+d+'. Movimientos nuevos desde entonces: '+n+'.',
    confirmDelPerson:n=>'¿Borrar a '+n+' y todos sus movimientos?',
    confirmDelMov:'¿Borrar este movimiento?',
    confirmRestore:'Esto reemplaza todos los datos actuales. ¿Continuar?',
    needName:'Escribe un nombre', needAmount:'Escribe un monto',
    saveFail:'No se pudo guardar', restored:'Datos restaurados',
    badFile:'Archivo no válido',
    backupHint:'Elige "Guardar en Archivos" → iCloud Drive',
    rememberBackup:'Recuerda guardar una copia',
    savedLent:m=>'Prestó '+m, savedPaid:m=>'Pagó '+m,
    months:['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']
  },
  en:{
    debtors:'Debtors', totalOwed:'Total owed to you', search:'Search…',
    owing:'Owing', settled:'Settled up', settledBadge:'Settled',
    emptyList:'No debtors yet.<br>Tap ＋ to add one.',
    noResults:'Nobody by that name.',
    noMovs:'No activity', owes:'Owes', activity:'Activity',
    emptyMovs:'No activity yet.',
    lent:'Lent', paid:'Paid',
    newPerson:'New debtor', editPerson:'Edit debtor',
    name:'Name', namePh:'John',
    noteOpt:'Note (optional)', personNotePh:'Phone, address…',
    addNote:'Note', movNotePh:'Cash, Zelle…',
    today:'today', cancel:'Cancel', save:'Save', close:'Close',
    options:'Options', language:'Language',
    saveBackup:'Save backup', restoreBackup:'Restore from backup',
    noBackupYet:'You have not saved a backup yet. The data lives only on this phone.',
    lastBackup:(d,n)=>'Last backup: '+d+'. New entries since then: '+n+'.',
    confirmDelPerson:n=>'Delete '+n+' and all their activity?',
    confirmDelMov:'Delete this entry?',
    confirmRestore:'This replaces all current data. Continue?',
    needName:'Enter a name', needAmount:'Enter an amount',
    saveFail:'Could not save', restored:'Data restored',
    badFile:'Invalid file',
    backupHint:'Choose "Save to Files" → iCloud Drive',
    rememberBackup:'Remember to save a backup',
    savedLent:m=>'Lent '+m, savedPaid:m=>'Paid '+m,
    months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
  }
};
function t(k){return T[db.lang||'es'][k];}

/* ---------- DATOS ---------- */
const KEY='pagos_v1';
let db={people:[],lastBackup:null,sinceBackup:0,lang:'es'};
let cur=null, editId=null;
let padPerson=null, padVal='';

function load(){
  try{const r=localStorage.getItem(KEY); if(r) db=JSON.parse(r);}catch(e){}
  if(!db.people) db.people=[];
  if(db.sinceBackup==null) db.sinceBackup=0;
  if(db.lang!=='en') db.lang='es';
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));}
  catch(e){toast(t('saveFail'));}
}
function money(n){
  return '$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function balance(p){
  return p.movs.reduce((s,m)=>s+(m.kind==='up'?m.amt:-m.amt),0);
}
function fdate(iso){
  const [y,m,d]=iso.split('-').map(Number);
  return db.lang==='en' ? t('months')[m-1]+' '+d+', '+y : d+' '+t('months')[m-1]+' '+y;
}
function today(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
function closeAll(){document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('on'));}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'),2200);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- IDIOMA ---------- */
function applyLang(){
  document.documentElement.lang=db.lang;
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t(el.dataset.t);});
  document.querySelectorAll('[data-tph]').forEach(el=>{el.placeholder=t(el.dataset.tph);});
  document.getElementById('lang-es').classList.toggle('on',db.lang==='es');
  document.getElementById('lang-en').classList.toggle('on',db.lang==='en');
}
function setLang(l){
  db.lang=l; save(); applyLang(); render();
  if(cur && document.getElementById('s-det').classList.contains('on')) openDetail(cur.id);
  openMenu();
}

/* ---------- LISTA ---------- */
function render(){
  const list=document.getElementById('list');
  const q=document.getElementById('search').value.trim().toLowerCase();
  document.getElementById('searchwrap').classList.toggle('on',db.people.length>6);
  if(db.people.length<=6) document.getElementById('search').value='';

  const all=[...db.people].filter(p=>!q||p.name.toLowerCase().includes(q));
  const owing=all.filter(p=>balance(p)>0).sort((a,b)=>balance(b)-balance(a));
  const clear=all.filter(p=>balance(p)<=0).sort((a,b)=>a.name.localeCompare(b.name));

  let html='';
  if(!db.people.length){
    html='<div class="empty">'+t('emptyList')+'</div>';
  }else if(!all.length){
    html='<div class="empty">'+t('noResults')+'</div>';
  }else{
    if(owing.length){
      html+='<div class="sect">'+t('owing')+'</div>';
      html+=owing.map((p,i)=>rowHtml(p,i===0&&!q)).join('');
    }
    if(clear.length){
      html+='<div class="sect">'+t('settled')+'</div>';
      html+=clear.map(p=>rowHtml(p,false,true)).join('');
    }
  }
  list.innerHTML=html;
  document.getElementById('grand').textContent=money(db.people.reduce((s,p)=>s+Math.max(0,balance(p)),0));
}
function rowHtml(p,isTop,isClear){
  const b=balance(p);
  const last=p.movs.length?p.movs[p.movs.length-1].date:null;
  const foot=isClear
    ? '<div class="badge">✓ '+t('settledBadge')+'</div>'
    : '<div class="row-sub">'+(last?fdate(last):t('noMovs'))+'</div>';
  return `<div class="row ${isTop?'top':''} ${isClear?'clear':''}">
    <div class="row-tap" onclick="openDetail('${p.id}')">
      <div class="av">${esc(p.name.charAt(0).toUpperCase())}</div>
      <div class="row-mid">
        <div class="row-name">${esc(p.name)}</div>
        <div class="row-amt">${money(b)}</div>
        ${foot}
      </div>
    </div>
    <button class="plus" onclick="openPad('${p.id}')">＋</button>
  </div>`;
}

/* ---------- DETALLE ---------- */
function openDetail(id){
  cur=db.people.find(p=>p.id===id); if(!cur) return;
  const b=balance(cur);
  document.getElementById('d-name').textContent=cur.name;
  const bal=document.getElementById('d-bal');
  bal.textContent=money(b);
  bal.classList.toggle('zero',b<=0);
  document.getElementById('d-note').textContent=cur.note||'';
  const box=document.getElementById('movs');
  const ms=[...cur.movs].sort((a,b2)=>b2.date.localeCompare(a.date));
  box.innerHTML=ms.length?ms.map(m=>`
    <div class="mv">
      <div class="tag ${m.kind}">${m.kind==='up'?'↑':'↓'}</div>
      <div class="mv-mid">
        <div class="mv-kind ${m.kind}">${m.kind==='up'?t('lent'):t('paid')}</div>
        <div class="mv-date">${fdate(m.date)}${m.note?' · '+esc(m.note):''}</div>
      </div>
      <div class="mv-amt ${m.kind}">${money(m.amt)}</div>
      <button class="mv-del" onclick="delMov('${m.id}')">×</button>
    </div>`).join('')
    :'<div class="empty">'+t('emptyMovs')+'</div>';
  show('s-det');
}

/* ---------- PERSONA ---------- */
function openPerson(p){
  editId=p?p.id:null;
  document.getElementById('p-title').textContent=p?t('editPerson'):t('newPerson');
  document.getElementById('p-name').value=p?p.name:'';
  document.getElementById('p-note').value=p&&p.note?p.note:'';
  document.getElementById('sh-person').classList.add('on');
  setTimeout(()=>document.getElementById('p-name').focus(),150);
}
function savePerson(){
  const n=document.getElementById('p-name').value.trim();
  if(!n){toast(t('needName'));return;}
  const note=document.getElementById('p-note').value.trim();
  const wasEdit=editId;
  if(wasEdit){
    const p=db.people.find(x=>x.id===wasEdit);
    p.name=n; p.note=note;
  }else{
    db.people.push({id:String(Date.now()),name:n,note:note,movs:[]});
  }
  save(); closeAll(); render();
  editId=null;
  if(wasEdit&&cur) openDetail(wasEdit);
}
function delPerson(){
  if(!cur) return;
  if(!confirm(t('confirmDelPerson')(cur.name))) return;
  db.people=db.people.filter(p=>p.id!==cur.id);
  save(); cur=null; show('s-list'); render();
}

/* ---------- TECLADO / MONTO ---------- */
function openPad(id){
  padPerson=db.people.find(p=>p.id===id); if(!padPerson) return;
  padVal='';
  document.getElementById('pad-who').textContent=padPerson.name;
  document.getElementById('pad-date').value=today();
  document.getElementById('pad-datetxt').textContent=t('today');
  const note=document.getElementById('pad-note');
  note.value=''; note.style.display='none';
  document.getElementById('pad-notebtn').style.display='';
  padDraw();
  document.getElementById('sh-pad').classList.add('on');
}
function padDraw(){
  const el=document.getElementById('pad-amt');
  el.classList.toggle('empty',!padVal);
  if(!padVal){el.textContent='$0';return;}
  const parts=padVal.split('.');
  const int=Number(parts[0]||0).toLocaleString('en-US');
  el.textContent='$'+int+(parts.length>1?'.'+parts[1]:'');
}
function padKey(k){
  if(k==='back'){padVal=padVal.slice(0,-1);}
  else if(k==='.'){if(!padVal.includes('.')) padVal=(padVal||'0')+'.';}
  else{
    const d=padVal.split('.');
    if(d.length>1&&d[1].length>=2) return;
    if(d[0].length>=9&&d.length===1) return;
    padVal+=k;
  }
  padDraw();
}
function padDateChanged(){
  const v=document.getElementById('pad-date').value;
  document.getElementById('pad-datetxt').textContent=(!v||v===today())?t('today'):fdate(v);
}
function toggleNote(){
  const n=document.getElementById('pad-note');
  n.style.display='';
  document.getElementById('pad-notebtn').style.display='none';
  setTimeout(()=>n.focus(),50);
}
function savePad(kind){
  const amt=Math.round(parseFloat(padVal||'0')*100)/100;
  if(!amt||amt<=0||isNaN(amt)){toast(t('needAmount'));return;}
  padPerson.movs.push({
    id:String(Date.now()),kind:kind,amt:amt,
    date:document.getElementById('pad-date').value||today(),
    note:document.getElementById('pad-note').value.trim()
  });
  db.sinceBackup++;
  save(); closeAll(); render();
  if(cur&&cur.id===padPerson.id&&document.getElementById('s-det').classList.contains('on')) openDetail(cur.id);
  toast(kind==='up'?t('savedLent')(money(amt)):t('savedPaid')(money(amt)));
  if(db.sinceBackup>=10) setTimeout(()=>toast(t('rememberBackup')),2400);
}
function delMov(id){
  if(!confirm(t('confirmDelMov'))) return;
  cur.movs=cur.movs.filter(m=>m.id!==id);
  save(); openDetail(cur.id); render();
}

/* ---------- MENU / COPIAS ---------- */
function openMenu(){
  const w=document.getElementById('bk-warn');
  w.textContent=db.lastBackup ? t('lastBackup')(fdate(db.lastBackup),db.sinceBackup) : t('noBackupYet');
  document.getElementById('sh-menu').classList.add('on');
}
function backup(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='pagos-'+today()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  db.lastBackup=today(); db.sinceBackup=0; save();
  closeAll(); toast(t('backupHint'));
}
function restore(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.people) throw 0;
      if(!confirm(t('confirmRestore'))) return;
      const keepLang=db.lang;
      db=d;
      if(db.sinceBackup==null) db.sinceBackup=0;
      if(db.lang!=='en'&&db.lang!=='es') db.lang=keepLang;
      save(); closeAll(); show('s-list'); applyLang(); render(); toast(t('restored'));
    }catch(err){toast(t('badFile'));}
  };
  r.readAsText(f);
  e.target.value='';
}

document.querySelectorAll('.sheet').forEach(s=>{
  s.addEventListener('click',ev=>{if(ev.target===s) closeAll();});
});

load(); applyLang(); render();
</script>
</body>
</html>
